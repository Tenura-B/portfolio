name: Production Deployment - Tenura Portfolio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. CI JOB: Test, Lint, Type Check & Build
  # ==========================================
  ci:
    name: Build & Verify (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.22.3
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint
        working-directory: ./client
        run: npm run lint

      - name: Run TypeScript Type Check
        working-directory: ./client
        run: npx tsc --noEmit

      - name: Test Next.js Production Build
        working-directory: ./client
        run: npm run build

  # ==========================================
  # 2. CD JOB: Secure Deployment to Hostinger VPS
  # ==========================================
  deploy:
    name: Deploy to Production VPS
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      VPS_HOST: "187.127.209.65"
      VPS_PORT: "22"
      VPS_USER: "portfolio-deploy"
      APP_DIR: "/opt/tenura-portfolio"
      BACKUP_DIR: "/home/portfolio-deploy/tenura-portfolio-backup"
      APP_PORT: "3020"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Create Pre-Deployment Backup on VPS
        run: |
          ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "
            set -e
            export PM2_HOME=/home/portfolio-deploy/.pm2
            if [ -d '${{ env.APP_DIR }}' ]; then
              echo '📦 Creating local backup of current release...'
              rm -rf '${{ env.BACKUP_DIR }}'
              cp -r '${{ env.APP_DIR }}' '${{ env.BACKUP_DIR }}'
            fi
          "

      - name: Transfer Project Files via Secure Rsync
        run: |
          # Rsync client directory to VPS using the active SSH agent
          rsync -avz --delete \
            -e "ssh -p ${{ env.VPS_PORT }}" \
            --exclude '.git*' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env*' \
            ./client/ ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/

      - name: Build, Reload PM2 & Perform Health Check
        run: |
          ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "
            set -euo pipefail

            export NVM_DIR=\"/home/portfolio-deploy/.nvm\"

            if [ ! -s \"\$NVM_DIR/nvm.sh\" ]; then
              echo \"NVM is not installed for portfolio-deploy\"
              exit 1
            fi

            source \"\$NVM_DIR/nvm.sh\"
            nvm use 24.22.3

            export PM2_HOME=/home/portfolio-deploy/.pm2
            cd /opt/tenura-portfolio

            # Function to trigger rollback if deployment fails
            rollback() {
              trap - ERR
              set +e
              echo '❌ Deployment step failed! Triggering safe rollback...'
              if [ -d '${{ env.BACKUP_DIR }}' ]; then
                echo '⏪ Restoring from backup...'
                rsync -a --delete --exclude '.env*' '${{ env.BACKUP_DIR }}/' '${{ env.APP_DIR }}/'
                if pm2 describe tenura-portfolio > /dev/null 2>&1; then
                  pm2 reload tenura-portfolio --update-env
                else
                  pm2 start ecosystem.config.cjs
                fi
                rm -rf '${{ env.BACKUP_DIR }}'
                echo '⏪ Rollback completed.'
              fi
              exit 1
            }

            trap rollback ERR

            echo '📦 Installing clean dependencies with npm ci...'
            npm ci

            echo '🔍 Running type check and lint on VPS...'
            npm run lint
            npx tsc --noEmit

            echo '🔨 Building Next.js production application...'
            npm run build

            echo '🔄 Reloading tenura-portfolio in PM2...'
            if pm2 describe tenura-portfolio > /dev/null 2>&1; then
              pm2 reload tenura-portfolio --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save

            echo '🩺 Running health check on port ${{ env.APP_PORT }}...'
            HEALTHY=0
            for i in {1..15}; do
              if curl -s -f http://127.0.0.1:${{ env.APP_PORT }} > /dev/null; then
                echo '✅ Application is healthy on port ${{ env.APP_PORT }}!'
                HEALTHY=1
                break
              fi
              echo \"⏳ Waiting for app response... (attempt \$i/15)\"
              sleep 2
            done

            if [ \$HEALTHY -ne 1 ]; then
              echo '❌ Health check timed out after 30 seconds!'
              rollback
            fi

            # Clean up backup after confirmed healthy deployment
            rm -rf '${{ env.BACKUP_DIR }}'
            echo '🎉 Tenura Portfolio deployment completed successfully!'
          "
